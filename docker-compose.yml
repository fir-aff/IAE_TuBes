version: '3.8'

services:
  # --- 1. GATEWAY ---
  graphql-gateway:
    build: ./graphql-gateway
    ports:
      - "4000:4000"
    networks:
      - travel-network
    depends_on:
      - membership-service
      - hotel-service
      - booking-service
      - payment-service
      - promo-service

  # --- 2. MEMBERSHIP SERVICE & DB ---
  membership-service:
    build: ./membership-service
    ports:
      - "4001:4000"
    environment:
      - DB_HOST=membership-db
      - DB_NAME=membership_db
      - DB_USER=user
      - DB_PASS=pass
    networks:
      - travel-network
    depends_on:
      - membership-db

  membership-db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=pass
      - POSTGRES_DB=membership_db
    networks:
      - travel-network
    volumes:                    # <--- DATA AMAN DI SINI
      - membership_data:/var/lib/postgresql/data

  # --- 3. HOTEL SERVICE & DB ---
  hotel-service:
    build: ./hotel-service
    ports:
      - "4002:4000"
    environment:
      - MONGO_URI=mongodb://hotel-db:27017/hotel_db
    networks:
      - travel-network
    depends_on:
      - hotel-db

  hotel-db:
    image: mongo:6
    networks:
      - travel-network
    volumes:                    # <--- DATA AMAN DI SINI
      - hotel_data:/data/db

  # --- 4. BOOKING SERVICE & DB ---
  booking-service:
    build: ./booking-service
    ports:
      - "4003:4000"
    environment:
      - DB_HOST=booking-db
      - DB_NAME=booking_db
      - DB_USER=user
      - DB_PASS=pass
    networks:
      - travel-network
    depends_on:
      - booking-db

  booking-db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=pass
      - POSTGRES_DB=booking_db
    networks:
      - travel-network
    volumes:                    # <--- DATA AMAN DI SINI
      - booking_data:/var/lib/postgresql/data

  # --- 5. PAYMENT SERVICE & DB ---
  payment-service:
    build: ./payment-service
    ports:
      - "4004:4000"
    environment:
      - DB_HOST=payment-db
      - DB_NAME=payment_db
      - DB_USER=user
      - DB_PASS=pass
    networks:
      - travel-network
    depends_on:
      - payment-db

  payment-db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=pass
      - POSTGRES_DB=payment_db
    networks:
      - travel-network
    volumes:                    # <--- DATA AMAN DI SINI
      - payment_data:/var/lib/postgresql/data

  # --- 6. PROMO SERVICE & DB ---
  promo-service:
    build: ./promo-service
    ports:
      - "4005:4000"
    environment:
      - DB_HOST=promo-db
      - DB_NAME=promo_db
      - DB_USER=user
      - DB_PASS=pass
    networks:
      - travel-network
    depends_on:
      - promo-db

  promo-db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=pass
      - POSTGRES_DB=promo_db
    networks:
      - travel-network
    volumes:                    # <--- DATA AMAN DI SINI
      - promo_data:/var/lib/postgresql/data

networks:
  travel-network:
    driver: bridge

# DAFTAR SEMUA VOLUME PENYIMPANAN
volumes:
  membership_data:
  hotel_data:
  booking_data:
  payment_data:
  promo_data: