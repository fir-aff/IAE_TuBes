version: '3.8'

services:
  graphql-gateway:
    build: ./graphql-gateway
    ports:
      - "4000:4000"
    networks:
      - travel-network
    depends_on:
      - membership-service
      - hotel-service
      - booking-service
      - payment-service
      - promo-service

  membership-service:
    build: ./membership-service
    ports:
      - "4001:4000"
    environment:
      - DB_HOST=membership-db
      - DB_NAME=membership_db
      - DB_USER=user
      - DB_PASS=pass
    networks:
      - travel-network
    depends_on:
      - membership-db

  membership-db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=pass
      - POSTGRES_DB=membership_db
    networks:
      - travel-network

  hotel-service:
    build: ./hotel-service
    ports:
      - "4002:4000"
    environment:
      - MONGO_URI=mongodb://hotel-db:27017/hotel_db
    networks:
      - travel-network
    depends_on:
      - hotel-db

  hotel-db:
    image: mongo:6
    networks:
      - travel-network

  booking-service:
    build: ./booking-service
    ports:
      - "4003:4000"
    environment:
      - DB_HOST=booking-db
      - DB_NAME=booking_db
      - DB_USER=user
      - DB_PASS=pass
    networks:
      - travel-network
    depends_on:
      - booking-db

  booking-db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=pass
      - POSTGRES_DB=booking_db
    networks:
      - travel-network

  payment-service:
    build: ./payment-service
    ports:
      - "4004:4000"
    environment:
      - DB_HOST=payment-db
      - DB_NAME=payment_db
      - DB_USER=user
      - DB_PASS=pass
    networks:
      - travel-network
    depends_on:
      - payment-db

  payment-db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=pass
      - POSTGRES_DB=payment_db
    networks:
      - travel-network

  promo-service:
    build: ./promo-service
    ports:
      - "4005:4000"
    environment:
      - DB_HOST=promo-db
      - DB_NAME=promo_db
      - DB_USER=user
      - DB_PASS=pass
    networks:
      - travel-network
    depends_on:
      - promo-db

  promo-db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=pass
      - POSTGRES_DB=promo_db
    networks:
      - travel-network

networks:
  travel-network:
    driver: bridge